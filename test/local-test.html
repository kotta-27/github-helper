<!doctype html>
<html lang="ja" data-color-mode="light">
  <head>
    <meta charset="utf-8" />
    <title>GitHub Helper — ローカル動作確認</title>
    <link rel="stylesheet" href="../content.css" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
        max-width: 900px;
        margin: 40px auto;
        padding: 0 16px;
        line-height: 1.7;
        color: #1f2328;
      }
      textarea {
        width: 100%;
        min-height: 160px;
        box-sizing: border-box;
        padding: 8px;
        font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #1f2328;
        background: #fff;
        border: 1px solid #d0d7de;
        border-radius: 6px;
      }
      h2 { font-size: 15px; margin-top: 32px; }
      code, kbd { background: #f0f1f3; padding: 1px 4px; border-radius: 4px; font-size: 12px; }
      .box {
        display: flex;
        flex-direction: column;
        width: 520px;
        padding: 8px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
      }
      .row { display: flex; flex-direction: row; align-items: flex-start; }
    </style>
  </head>
  <body>
    <h1>ローカル動作確認</h1>
    <p>
      拡張機能をインストールしなくても、このファイルを Chrome で直接開けば挙動を試せます
      （<code>chrome.storage</code> はスタブ、設定はデフォルト固定）。
    </p>
    <p>
      <code>/ni</code> まで打つと候補が出て、<kbd>Tab</kbd> / <kbd>Enter</kbd> で挿入、スペースでも確定します。
      Preview の見出しの右端のボタンで Preview を出し入れできます。
    </p>

    <h2>1. コメント欄（右に Preview が並ぶ）</h2>
    <textarea name="comment[body]" placeholder="Leave a comment"></textarea>
    <p>
      <button type="button" id="sample">サンプルの Markdown を流し込む</button>
    </p>

    <h2>2. GitHub のインラインレビュー欄くらいの幅（flex 縦並びの親）</h2>
    <div class="box">
      <textarea name="issue[body]" placeholder="Leave a comment"></textarea>
    </div>

    <h2>3. flex 横並びの親</h2>
    <div class="row">
      <textarea name="pull_request[body]" placeholder="Leave a comment"></textarea>
    </div>

    <h2>4. ただのテキストエリア（Preview なし・変換とプレビュー候補のみ）</h2>
    <textarea placeholder="/imo と打ってスペース"></textarea>

    <script>
      // 拡張機能の API をスタブして content.js をそのまま読み込む
      window.chrome = {
        runtime: {},
        storage: {
          sync: { get: (defaults, cb) => cb(defaults) },
          onChanged: { addListener: () => {} },
        },
      };
    </script>
    <script src="../content.js"></script>
    <script>
      document.getElementById('sample').addEventListener('click', () => {
        const source = document.querySelector('textarea[name="comment[body]"]');
        const doc = [
          '## レビュー',
          '',
          '![](https://img.shields.io/badge/review-imo-orange.svg) この書き方だと N+1 になります',
          '',
          '- sasa',
          '  - ネストした項目',
          '- [ ] あとで直す',
          '- [x] 済み',
          '',
          '1. 一番目',
          '2. 二番目',
          '',
          '> 参考: **eager loading** を使うと `includes` 一発です',
          '',
          '```ruby',
          'this is a test',
          'Manual.includes(:steps)',
          '```',
          '',
          '直したら [PR](https://example.com) で教えてください',
        ].join('\n');
        const setter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set;
        setter.call(source, doc);
        source.dispatchEvent(new Event('input', { bubbles: true }));
      });
    </script>
  </body>
</html>

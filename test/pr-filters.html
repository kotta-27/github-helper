<!doctype html>
<html lang="ja" data-color-mode="light">
  <head>
    <meta charset="utf-8" />
    <!-- GitHub はログイン中のユーザー名をここに出す -->
    <meta name="user-login" content="octocat" />
    <title>GitHub Helper — PR 一覧の絞り込みボタン</title>
    <link rel="stylesheet" href="/pr-filters.css" />
    <style>
      /* GitHub の PR 一覧の見出しまわりを、拡張が触る範囲だけ再現する */
      body {
        max-width: 1000px;
        margin: 40px auto;
        padding: 0 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
        color: #1f2328;
        background: #ffffff;
      }
      h1 { margin: 0; }
      .d-flex { display: flex; }
      .flex-items-top { align-items: flex-start; }
      .flex-items-center { align-items: center; }
      .gap-2 { gap: 8px; }
      .flex-1 { flex: 1; }
      .min-width-0 { min-width: 0; }
      .h3 { font-size: 20px; font-weight: 600; line-height: 1.5; }
      .mb-1 { margin-bottom: 4px; }
      .tmp-mb-3 { margin-bottom: 16px; }
      .fake-button {
        padding: 5px 16px;
        font-size: 14px;
        font-weight: 500;
        color: #ffffff;
        background: #1f883d;
        border-radius: 6px;
      }
      .fake-search {
        padding: 5px 12px;
        font-size: 14px;
        border: 1px solid #d1d9e0;
        border-radius: 6px;
      }
      #results { margin-top: 32px; font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .pass { color: #1a7f37; }
      .fail { color: #d1242f; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="header" class="d-flex tmp-mb-3 gap-2">
      <div class="flex-1 min-width-0">
        <div id="title-row" class="d-flex flex-items-top gap-2">
          <h1 class="h3 min-width-0 mb-1" data-testid="header-title"><div>All pull requests</div></h1>
        </div>
      </div>
      <div class="d-flex flex-items-center gap-2"><span class="fake-button">New pull request</span></div>
    </div>
    <div class="fake-search">is:pr state:open</div>

    <p>
      <code>node test/serve.mjs</code> で立てたサーバ経由で開くと、拡張機能を入れずに
      <code>pr-filters.js</code> の挙動を確かめられます。下に各項目の結果が出ます。
    </p>
    <ol id="results"></ol>

    <script>
      // 拡張機能の API をスタブする。設定はテストが releaseSettings() を呼ぶまで返さず、
      // 読み込み前に出ないことを時間に頼らず確かめる
      let releaseSettings = null;
      let onChanged = null;
      window.chrome = {
        runtime: {},
        storage: {
          sync: { get: (defaults, cb) => (releaseSettings = () => cb({ ...defaults })) },
          onChanged: { addListener: (fn) => (onChanged = fn) },
        },
      };
    </script>
    <script src="/pr-filters.js"></script>
    <script>
      (async () => {
        const results = document.getElementById('results');
        const report = (name, ok, detail = '') => {
          const li = document.createElement('li');
          li.className = ok ? 'pass' : 'fail';
          li.textContent = `${ok ? 'PASS' : 'FAIL'} ${name}${detail ? ` — ${detail}` : ''}`;
          results.appendChild(li);
        };

        const frames = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(() => requestAnimationFrame(r))));
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
        // GitHub が画面の一部を描き直したときと同じく、DOM を変化させる
        const poke = async () => {
          const dummy = document.createElement('i');
          document.body.appendChild(dummy);
          dummy.remove();
          await frames();
        };
        const go = async (path, q) => {
          history.pushState(null, '', q == null ? path : `${path}?q=${encodeURIComponent(q)}`);
          await poke();
        };
        const group = () => document.querySelector('.ghh-pr-filters');
        const links = () => [...(group()?.querySelectorAll('a.ghh-pr-filter') || [])];
        const link = (label) => links().find((a) => a.textContent === label);
        const qOf = (a) => new URL(a.href).searchParams.get('q');
        const active = () => links().filter((a) => a.getAttribute('aria-current') === 'true').map((a) => a.textContent);
        const title = () => document.querySelector('h1[data-testid="header-title"]');

        const PATH = location.pathname;

        // 1. 設定を読むまでは出さない
        await frames();
        report('設定を読む前はボタンを出さない', !group());
        releaseSettings();
        await poke();

        // 2. 見出しの直後に4つのボタン。どれも選ばれていない
        report('見出しの直後にボタンの並びがある', group() && title().nextElementSibling === group());
        report('ボタンは4つ', links().length === 4, links().map((a) => a.textContent).join(' / '));
        report('条件なしのときは、どれも選ばれていない', active().length === 0, active().join(','));
        report('My PRs を押すと author:@me で絞る', qOf(link('My PRs')) === 'is:pr state:open author:@me', qOf(link('My PRs')));
        report('Review requested を押すと review-requested:@me で絞る',
          qOf(link('Review requested')) === 'is:pr state:open review-requested:@me');
        report('Assigned を押すと assignee:@me で絞る', qOf(link('Assigned')) === 'is:pr state:open assignee:@me');
        report('Mentioned を押すと mentions:@me で絞る', qOf(link('Mentioned')) === 'is:pr state:open mentions:@me');
        report('リンク先は同じ PR 一覧', new URL(link('My PRs').href).pathname === PATH);

        // 3. 絞り込み中は選択中になり、もう一度押すと全件に戻る
        await go(PATH, 'is:pr state:open author:@me');
        report('author:@me のときは My PRs が選択中', active().join(',') === 'My PRs', active().join(','));
        report('選択中の My PRs を押すと全件に戻る', qOf(link('My PRs')) === 'is:pr state:open', qOf(link('My PRs')));
        report('ほかのボタンは自分の条件だけに切り替える',
          qOf(link('Assigned')) === 'is:pr state:open assignee:@me', qOf(link('Assigned')));

        // 4. 大文字小文字や余分な空白、Closed への切り替えがあっても選択中と分かる
        await go(PATH, 'is:pr  state:closed  AUTHOR:@me');
        report('大文字や Closed でも My PRs が選択中', active().join(',') === 'My PRs', active().join(','));

        // 5. ブラウザの「戻る」に追従する
        await go(PATH, 'is:pr state:open assignee:@me');
        report('assignee:@me のときは Assigned が選択中', active().join(',') === 'Assigned', active().join(','));
        const popped = new Promise((r) => window.addEventListener('popstate', r, { once: true }));
        history.back();
        await popped;
        await frames();
        report('戻ると前の条件（My PRs）が選択中に戻る', active().join(',') === 'My PRs', active().join(','));

        // 6. GitHub が見出しを描き直しても、新しい見出しの隣に1つだけ付け直す
        const fresh = title().cloneNode(true);
        document.getElementById('title-row').replaceChildren(fresh);
        await frames();
        report('見出しを描き直しても付け直す', title().nextElementSibling === group());
        report('ボタンの並びは1つだけ', document.querySelectorAll('.ghh-pr-filters').length === 1);

        // 7. PR 一覧以外のページでは出さない
        await go(PATH.replace(/pulls\/?$/, 'issues'));
        report('Issues の一覧では出さない', !group());
        await go(PATH);
        report('PR 一覧に戻ると出る', !!group());

        // 8. ログインしていないときは出さない（@me が使えない）
        const meta = document.querySelector('meta[name="user-login"]');
        meta.content = '';
        await poke();
        report('ログインしていないときは出さない', !group());
        meta.content = 'octocat';
        await poke();

        // 9. オプションで切り替えられる
        onChanged({ prFilters: { newValue: false } }, 'sync');
        await frames();
        report('オプションでオフにすると消える', !group());
        onChanged({ prFilters: { newValue: true } }, 'sync');
        await frames();
        report('オプションでオンに戻すと出る', !!group());

        // 見た目の確認用に、My PRs を選んだ状態で止める
        await go(PATH, 'is:pr state:open author:@me');

        const failed = results.querySelectorAll('.fail').length;
        document.title = failed ? 'HAS_FAIL' : 'ALL_PASS';
      })().catch((error) => {
        document.getElementById('results').textContent = `ERROR ${error.stack}`;
        document.title = 'HAS_FAIL';
      });
    </script>
  </body>
</html>
